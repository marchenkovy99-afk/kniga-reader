name: LIBRA icon raster assets
on:
  push:
    branches: ['feature/libra-standalone-v1']
    paths:
      - 'libra/public/icon.svg'
      - '.github/workflows/libra-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rasterize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/libra-standalone-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rasterize the source icon without embedding SVG inside iOS touch icons
        run: |
          python -m pip install --quiet cairosvg pillow
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import cairosvg
          from PIL import Image
          base=Path('libra/public')
          for size in [180,512]:
              png=cairosvg.svg2png(url=str(base/'icon.svg'),
                                  output_width=size,output_height=size)
              im=Image.open(BytesIO(png)).convert('RGB')
              im.save(base/f'icon-{size}.png',optimize=True)
          PY
      - name: Commit checked iOS icon assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add libra/public/icon-180.png libra/public/icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "build(libra): rasterize native 180px and 512px app icons"
            git push origin HEAD:feature/libra-standalone-v1
          fi
