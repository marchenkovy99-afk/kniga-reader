name: Libra iPhone PWA verification
on:
  push:
    branches: ['qa/full-performance-20261111']
    paths: ['release/tests/qa/iphone-pwa.mjs', '.github/workflows/libra-pwa-qa-20261111.yml']
permissions:
  contents: read
jobs:
  iphone-pwa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit and offline integrity checks
        working-directory: release
        run: npm ci --ignore-scripts --no-audit --no-fund && npm test && npm run verify
      - name: Install isolated browser test tools
        run: |
          npm install --prefix /tmp/libra-pwa --ignore-scripts --no-audit --no-fund playwright@1.56.1
          /tmp/libra-pwa/node_modules/.bin/playwright install --with-deps webkit chromium
      - name: Verify actual release in simulated iPhone standalone contexts
        env:
          PLAYWRIGHT_MODULE: /tmp/libra-pwa/node_modules/playwright/index.mjs
          BASE_URL: https://libra-standalone-preview-drp20ahq6-marchenkovy99-3693.vercel.app/
        run: node release/tests/qa/iphone-pwa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libra-iphone-pwa-results
          path: test-results/iphone-pwa
          if-no-files-found: warn
