name: Build reader for GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'reader/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-reader.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Update lockfile for maintained flipbook engine
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: npm run build:pages
      - name: Install Chromium and WebKit for PWA regression checks
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Check installed iPhone PWA in Chromium and WebKit
        run: |
          INSTALLED_APP=1 node tests/reader-geometry.browser.mjs
          node tests/pagination-layout.browser.mjs
          node tests/reader-pwa.webkit.browser.mjs
      - name: Save PWA WebKit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-webkit-screenshots
          path: test-results/pwa/
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish compiled reader
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Build reader for GitHub Pages'
            git push
          fi
