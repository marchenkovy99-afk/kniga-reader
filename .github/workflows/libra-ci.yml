name: LIBRA standalone reader checks
on:
  push:
    branches: ['feature/libra-standalone-v1']
    paths:
      - 'libra/**'
      - '.github/workflows/libra-ci.yml'
  pull_request:
    paths:
      - 'libra/**'
      - '.github/workflows/libra-ci.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build PWA
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: libra-dist
          path: libra/dist
          if-no-files-found: error
