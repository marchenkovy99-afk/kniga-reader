name: LIBRA standalone reader checks
on:
  push:
    branches: ['feature/libra-standalone-v1', 'feature/libra-comfort-dark-release']
    paths:
      - 'libra/**'
      - '.github/workflows/libra-ci.yml'
  workflow_dispatch:
concurrency:
  group: libra-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build PWA
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: libra-dist
          path: libra/dist
          if-no-files-found: error
  browser:
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app and Playwright test runner
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @playwright/test@1.56.1
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run browser integrity tests
        run: npx playwright test --config playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libra-browser-results
          path: libra/test-results
          if-no-files-found: ignore
